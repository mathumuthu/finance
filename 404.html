<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page Not Found | finance.</title>
  <meta name="description" content="The page you requested could not be found.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<section class="error-wrap">
  <div class="container">
    <div class="error-illus reveal"><i class="bi bi-compass"></i></div>
    <div class="error-code reveal d1">4<span>0</span>4</div>
    <h2 class="reveal d2">Oops! Page Not Found</h2>
    <p class="reveal d2">The page you are looking for was moved, removed, renamed or might never have existed. Let's get you back on track.</p>
    <div class="reveal d3">
    <a class="btn-green" href="index.html">
        <i class="bi bi-house-door"></i> Go Home
    </a>

    <button class="btn-outline-light ms-2" onclick="history.back()">
        <i class="bi bi-arrow-left"></i> Go Back
    </button>
</div>
</section>

<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
